# Local one-command stack for the vista_comic backend (M5 Slice 4, sub-step B).
#
# Two services: the FastAPI `api` and a `postgres` reading-progress store.
# The catalog stays scan-derived in memory; Postgres holds ONLY folder-external
# reading progress (a single `progress` table).
#
# ${MANGA_LIBRARY_PATH} is interpolated at parse time from the gitignored
# repo-root .env (auto-discovered because this file sits at the repo root).
# That HOST path is bind-mounted read-only at /library; the process INSIDE the
# container sees MANGA_LIBRARY_PATH=/library (set below), which is the path it
# actually scans. Same variable name, two scopes — intentional.
#
# Secret discipline: POSTGRES_PASSWORD and DATABASE_URL come from the same
# gitignored repo-root .env. Non-secret local defaults (:-...) keep one-command
# dev working; real credentials are never committed. The in-container
# DATABASE_URL uses host `postgres`; local uvicorn/tests use `localhost:5432`.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MANGA_LIBRARY_PATH=/library
      # Inside the compose network the DB host is the `postgres` service name.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-vista}:${POSTGRES_PASSWORD:-vista}@postgres:5432/${POSTGRES_DB:-vista}
      # llm-comprehension ticket 11: backs POST /comprehend. The repo-root
      # .env is only used by Compose itself to interpolate ${...} here -- it
      # is never copied into the container -- so this must be forwarded
      # explicitly, the same as DATABASE_URL above.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - "${MANGA_LIBRARY_PATH}:/library:ro"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # curl is not in the slim base image; probe with the bundled Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vista}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vista}
      - POSTGRES_DB=${POSTGRES_DB:-vista}
    ports:
      # Published so local uvicorn/tests can reach the DB at localhost:5432.
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vista} -d ${POSTGRES_DB:-vista}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Public HTTPS endpoint for `api` via a Cloudflare named Tunnel (ADR-0005) —
  # `cloudflared` makes an outbound-only connection to Cloudflare's edge, so no
  # port-forwarding or static public IP is needed. Access control (Cloudflare
  # Access + Service Token) is enforced at the edge, in front of this tunnel —
  # this container and the `api` service stay unaware of it.
  #
  # Setup is manual (interactive `cloudflared` CLI login + Cloudflare Zero
  # Trust dashboard) and is NOT part of this compose file — see the numbered
  # instructions in .scratch/remote-access/issues/01-public-tunnel-and-access-gate.md
  # for exactly what to run once, by hand, before this service comes up.
  #
  # ./cloudflared/config.yml is a committed template (placeholders only).
  # The real tunnel credentials JSON (written by `cloudflared tunnel create`)
  # must be dropped into ./cloudflared/ alongside it and is gitignored —
  # never commit it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - "./cloudflared:/etc/cloudflared:ro"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
