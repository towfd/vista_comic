# The same split the Vite dev server makes (vite.config.ts): the API's paths go
# to the backend, everything else is the app. The backend here is the `api`
# service on the compose network, reached directly -- no Cloudflare, so no
# Service Token. Who can open this page is decided by which interfaces its port
# is published on (docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(comics|media|cards|study)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets carry a content hash in their name, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path is a page of the app: the router reads it in the browser.
    # index.html itself is never cached, so a redeploy is seen on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
